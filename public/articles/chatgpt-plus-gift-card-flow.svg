<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Apple Gift Card to ChatGPT Plus subscription flow</title>
  <desc id="desc">Four steps: match the gift card region, redeem it to Apple Account balance, verify the balance, and subscribe to ChatGPT Plus through the iOS app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8aa8ff"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".26"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <circle cx="1100" cy="68" r="180" fill="#627dff" opacity=".08"/>
  <circle cx="110" cy="520" r="220" fill="#9b8cff" opacity=".06"/>

  <text x="72" y="82" fill="#f6f8ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">Apple Gift Card → ChatGPT Plus</text>
  <text x="72" y="119" fill="#9eabc2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">The safe path is account alignment, not a region workaround.</text>

  <path d="M270 311H360M552 311H642M834 311H924" stroke="#53617a" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 11"/>
  <path d="M348 300l14 11-14 11M630 300l14 11-14 11M912 300l14 11-14 11" fill="none" stroke="#8aa8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="54" y="164" width="216" height="294" rx="24" fill="#172235" stroke="#2d3b55"/>
    <rect x="336" y="164" width="216" height="294" rx="24" fill="#172235" stroke="#2d3b55"/>
    <rect x="618" y="164" width="216" height="294" rx="24" fill="#172235" stroke="#2d3b55"/>
    <rect x="900" y="164" width="246" height="294" rx="24" fill="#172235" stroke="#2d3b55"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <circle cx="92" cy="204" r="20" fill="url(#accent)"/>
    <text x="92" y="211" text-anchor="middle" fill="#0c1322" font-size="18" font-weight="800">1</text>
    <path d="M119 260h86a18 18 0 0118 18v54a18 18 0 01-18 18h-86a18 18 0 01-18-18v-54a18 18 0 0118-18z" fill="#22314a" stroke="#8aa8ff" stroke-width="3"/>
    <path d="M125 283h50M125 305h72M125 327h38" stroke="#d9e1f2" stroke-width="6" stroke-linecap="round"/>
    <circle cx="206" cy="282" r="7" fill="#9b8cff"/>
    <text x="78" y="394" fill="#f5f7ff" font-size="23" font-weight="700">同区</text>
    <text x="78" y="423" fill="#9eabc2" font-size="16" letter-spacing="1.5">SAME REGION</text>

    <circle cx="374" cy="204" r="20" fill="url(#accent)"/>
    <text x="374" y="211" text-anchor="middle" fill="#0c1322" font-size="18" font-weight="800">2</text>
    <rect x="387" y="253" width="114" height="104" rx="20" fill="#22314a" stroke="#8aa8ff" stroke-width="3"/>
    <path d="M415 281h58M415 305h58M415 329h34" stroke="#d9e1f2" stroke-width="6" stroke-linecap="round"/>
    <path d="M444 231v31M431 247l13 15 13-15" fill="none" stroke="#9b8cff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="394" fill="#f5f7ff" font-size="23" font-weight="700">兑换</text>
    <text x="360" y="423" fill="#9eabc2" font-size="16" letter-spacing="1.5">REDEEM</text>

    <circle cx="656" cy="204" r="20" fill="url(#accent)"/>
    <text x="656" y="211" text-anchor="middle" fill="#0c1322" font-size="18" font-weight="800">3</text>
    <circle cx="726" cy="305" r="58" fill="#22314a" stroke="#8aa8ff" stroke-width="3"/>
    <path d="M704 305h44M726 283v44" stroke="#d9e1f2" stroke-width="7" stroke-linecap="round"/>
    <path d="M691 245c10-11 22-17 35-17 15 0 29 7 39 19" fill="none" stroke="#9b8cff" stroke-width="6" stroke-linecap="round"/>
    <text x="642" y="394" fill="#f5f7ff" font-size="23" font-weight="700">余额</text>
    <text x="642" y="423" fill="#9eabc2" font-size="16" letter-spacing="1.5">CHECK BALANCE</text>

    <circle cx="938" cy="204" r="20" fill="url(#accent)"/>
    <text x="938" y="211" text-anchor="middle" fill="#0c1322" font-size="18" font-weight="800">4</text>
    <rect x="976" y="235" width="94" height="137" rx="19" fill="#22314a" stroke="#8aa8ff" stroke-width="3"/>
    <rect x="989" y="255" width="68" height="77" rx="12" fill="#111a2b"/>
    <path d="M1007 294l11 11 25-27" fill="none" stroke="#9b8cff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1023" cy="351" r="7" fill="#d9e1f2"/>
    <text x="924" y="394" fill="#f5f7ff" font-size="23" font-weight="700">订阅</text>
    <text x="924" y="423" fill="#9eabc2" font-size="16" letter-spacing="1.5">SUBSCRIBE IN iOS</text>
  </g>

  <text x="72" y="513" fill="#76849d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Confirm the plan, local price, renewal terms, and accepted payment method on Apple’s sheet before purchase.</text>
</svg>
